server {
    listen 80;
    
    # Bạn có thể thay đổi server_name thành IP hoặc domain thực tế
    server_name _; 

    # Thư mục web root chính
    root /var/www/my-web/html;
    index index.html index.htm;

    # 1. Cấu hình trang lỗi 404
    error_page 404 /404.html;

    # 2. Bảo mật tệp 404.html bằng chỉ thị internal
    location = /404.html {
        root /var/www/my-web/html;
        internal;
    }

    # Cấu hình location mặc định
    location / {
        try_files $uri $uri/ =404;
    }
}
